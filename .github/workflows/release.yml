name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish macOS release
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      # Needed to create the GitHub Release and upload the .zip asset.
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build
        run: make build

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/Digilog.app "Digilog-${VERSION}.zip"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(Digilog-*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no release artifacts found" >&2
            exit 1
          fi
          flags=(--generate-notes)
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${flags[@]}" "${files[@]}"
